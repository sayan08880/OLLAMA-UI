<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLLAMA</title>
    <link rel="icon" type="image/jpeg" href="logo.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Top Bar -->
    <header class="topbar">
        <div class="topbar-left">
            <div class="logo">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                <span>OLLAMA</span>
            </div>
            <div class="model-dropdown" id="modelDropdown">
                <button class="model-pill" id="modelPillBtn" onclick="toggleModelMenu()">
                    <span class="dot online" id="statusDot"></span>
                    <span class="model-name" id="modelName">AI</span>
                    <svg class="model-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </button>
                <div class="model-menu" id="modelMenu"></div>
            </div>
        </div>
        <div class="topbar-right">
            <button class="icon-btn" onclick="newChat()" title="New Chat (Ctrl+Shift+N)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </button>
            <button class="icon-btn" onclick="toggleShortcuts()" title="Shortcuts">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                    <line x1="8" y1="21" x2="16" y2="21"/>
                    <line x1="12" y1="17" x2="12" y2="21"/>
                </svg>
            </button>
            <button class="icon-btn" onclick="clearChat()" title="Clear Chat (Ctrl+L)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Shortcuts Modal -->
    <div class="modal" id="shortcutsModal" onclick="if(event.target===this)toggleShortcuts()">
        <div class="modal-box">
            <h3>Keyboard Shortcuts</h3>
            <div class="shortcut-row"><kbd>Enter</kbd><span>Send message</span></div>
            <div class="shortcut-row"><kbd>Shift</kbd>+<kbd>Enter</kbd><span>New line</span></div>
            <div class="shortcut-row"><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd><span>New chat</span></div>
            <div class="shortcut-row"><kbd>Ctrl</kbd>+<kbd>L</kbd><span>Clear chat</span></div>
            <div class="shortcut-row"><kbd>Esc</kbd><span>Stop generating</span></div>
            <button class="modal-close" onclick="toggleShortcuts()">Close</button>
        </div>
    </div>

    <!-- Main Chat -->
    <main class="chat-wrap">
        <div class="chat-scroll" id="chatScroll">
            <!-- Welcome -->
            <div class="welcome" id="welcome">
                <div class="welcome-center">
                    <div class="welcome-icon">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                            <path d="M2 17l10 5 10-5"/>
                            <path d="M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <h1>What can I help with?</h1>
                    <p>Upload a file or start typing</p>
                </div>
            </div>

            <!-- Messages -->
            <div class="messages" id="messages"></div>
            <div class="scroll-pad"></div>
        </div>

        <!-- Input -->
        <div class="input-bar">
            <div class="input-box">
                <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Upload file">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                    </svg>
                </button>
                <textarea id="userInput" placeholder="Message..." rows="1"
                    onkeydown="handleKey(event)"
                    oninput="resize(this)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="handleSendClick()">
                    <svg id="sendIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3.5 4.5 L20.5 12 L3.5 19.5 L3.5 14.2 L13.5 12 L3.5 9.8 Z"/>
                    </svg>
                    <svg id="stopIcon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                        <rect x="4" y="4" width="16" height="16" rx="2"/>
                    </svg>
                </button>
            </div>
            <div class="input-meta">
                <span id="fileChip" style="display:none"></span>
                <span class="hint"><!-- TYPE MSG --></span>
            </div>
        </div>
    </main>

    <input type="file" id="fileInput" hidden
        accept=".txt,.md,.pdf,.py,.js,.jsx,.ts,.tsx,.html,.htm,.css,.scss,.sass,.c,.cpp,.cc,.cxx,.h,.hpp,.java,.kt,.go,.rs,.swift,.rb,.php,.pl,.sh,.bash,.zsh,.json,.xml,.yaml,.yml,.toml,.ini,.cfg,.conf,.sql,.r,.m,.lua,.dart,.scala,.groovy,.clj,.cs,.vb,.fs,.fsx,.pas,.dpr,.log,.csv,.tsv,.tex,.bib,.dockerfile,.makefile,.cmake,.gradle,.podfile">

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
