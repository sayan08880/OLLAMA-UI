<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLLAMA</title>
    <link rel="icon" type="image/jpeg" href="logo.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ v }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-orb"></div>
    <!-- Top Bar -->
    <header class="topbar">
        <div class="topbar-left">
            <div class="logo">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                <span>OLLAMA</span>
            </div>
            <div class="model-dropdown" id="modelDropdown">
                <button class="model-pill" id="modelPillBtn" onclick="toggleModelMenu()">
                    <span class="dot online" id="statusDot"></span>
                    <span class="model-name" id="modelName">AI</span>
                    <svg class="model-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </button>
                <div class="model-menu" id="modelMenu"></div>
            </div>
        </div>
        <div class="topbar-right">
            <button class="icon-btn" onclick="newChat()" title="NEW CHAT (CTRL+SHIFT+N)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </button>
            <button class="icon-btn" onclick="toggleShortcuts()" title="SHORTCUTS">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                    <line x1="8" y1="21" x2="16" y2="21"/>
                    <line x1="12" y1="17" x2="12" y2="21"/>
                </svg>
            </button>
            <button class="icon-btn" onclick="clearChat()" title="CLEAR CHAT (CTRL+L)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Shortcuts Modal -->
    <div class="modal" id="shortcutsModal" onclick="if(event.target===this)toggleShortcuts()">
        <div class="modal-box">
            <h3>KEYBOARD SHORTCUTS</h3>
            <div class="shortcut-row"><kbd>ENTER</kbd><span>SEND MESSAGE</span></div>
            <div class="shortcut-row"><kbd>SHIFT</kbd>+<kbd>ENTER</kbd><span>NEW LINE</span></div>
            <div class="shortcut-row"><kbd>CTRL</kbd>+<kbd>SHIFT</kbd>+<kbd>N</kbd><span>NEW CHAT</span></div>
            <div class="shortcut-row"><kbd>CTRL</kbd>+<kbd>L</kbd><span>CLEAR CHAT</span></div>
            <div class="shortcut-row"><kbd>ESC</kbd><span>STOP GENERATING</span></div>
            <button class="modal-close" onclick="toggleShortcuts()">CLOSE</button>
        </div>
    </div>

    <!-- Main Chat -->
    <main class="chat-wrap">
        <div class="chat-scroll" id="chatScroll">
            <!-- Welcome -->
            <div class="welcome" id="welcome">
                <div class="welcome-center">
                    <div class="welcome-icon">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                            <path d="M2 17l10 5 10-5"/>
                            <path d="M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <h1>WHAT CAN I HELP WITH?</h1>
                    <p>UPLOAD A FILE OR START TYPING</p>
                </div>
            </div>

            <!-- Messages -->
            <div class="messages" id="messages"></div>
            <div class="scroll-pad"></div>
        </div>

        <!-- Input -->
        <!-- Gmail selection panel (appears in the input box position) -->
        <div class="input-bar" id="inputBar">
            <div class="gmail-panel" id="gmailPanel" style="display:none">
                <div class="gp-head">
                    <div class="gp-title"><i class="gp-pulse"></i><span id="gmailStatusText">GMAIL MODE</span></div>
                    <button class="gmail-close" onclick="exitGmailMode()">EXIT GMAIL</button>
                </div>
                <div class="gmail-options" id="gmailActions" role="radiogroup" aria-label="GMAIL ACTIONS">
                    <label class="gopt"><input type="radio" name="gmailOpt" value="connect" onchange="gmailAction(this.value)">
                        <span class="gopt-card"><span class="gopt-dot"></span><span class="gopt-num">1</span>
                        <span class="gopt-text"><b>CONNECT GMAIL KEY</b><small>SIGN IN WITH GOOGLE OAUTH</small></span></span></label>
                    <label class="gopt"><input type="radio" name="gmailOpt" value="read" onchange="gmailAction(this.value)">
                        <span class="gopt-card"><span class="gopt-dot"></span><span class="gopt-num">2</span>
                        <span class="gopt-text"><b>MAIL READ</b><small>LOAD YOUR LATEST EMAILS</small></span></span></label>
                    <label class="gopt"><input type="radio" name="gmailOpt" value="analyze" onchange="gmailAction(this.value)">
                        <span class="gopt-card"><span class="gopt-dot"></span><span class="gopt-num">3</span>
                        <span class="gopt-text"><b>ANALYZE MAILS</b><small>AI SUMMARY OF EACH EMAIL</small></span></span></label>
                    <label class="gopt"><input type="radio" name="gmailOpt" value="draft" onchange="gmailAction(this.value)">
                        <span class="gopt-card"><span class="gopt-dot"></span><span class="gopt-num">4</span>
                        <span class="gopt-text"><b>GENERATE DRAFT</b><small>WRITE AN EMAIL WITH AI</small></span></span></label>
                    <label class="gopt"><input type="radio" name="gmailOpt" value="save_draft" onchange="gmailAction(this.value)">
                        <span class="gopt-card"><span class="gopt-dot"></span><span class="gopt-num">5</span>
                        <span class="gopt-text"><b>SAVE DRAFT TO GMAIL</b><small>GENERATE + SAVE (NEVER SENDS)</small></span></span></label>
                </div>
                <div class="gmail-form" id="gmailForm" style="display:none">
                    <div id="gmailFormFields"></div>
                    <button class="gmail-submit" id="gmailSubmitBtn" onclick="submitGmailForm()">RUN</button>
                </div>
            </div>

            <div class="input-box">
                <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="UPLOAD FILE">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                    </svg>
                </button>
                <button class="web-btn" id="webBtn" onclick="toggleWeb()" title="WEB SEARCH (TAVILY)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="2" y1="12" x2="22" y2="12"/>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    </svg>
                </button>
                <button class="gmail-btn" id="gmailBtn" onclick="toggleGmailMode()" title="GMAIL INTEGRATION">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                </button>
                <textarea id="userInput" placeholder="MESSAGE..." rows="1"
                    onkeydown="handleKey(event)"
                    oninput="resize(this)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="handleSendClick()">
                    <svg id="sendIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3.5 4.5 L20.5 12 L3.5 19.5 L3.5 14.2 L13.5 12 L3.5 9.8 Z"/>
                    </svg>
                    <svg id="stopIcon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                        <rect x="4" y="4" width="16" height="16" rx="2"/>
                    </svg>
                </button>
            </div>
            <div class="input-meta">
                <span id="fileChip" style="display:none"></span>
                <span id="webChip" style="display:none"></span>
                <span id="gmailChip" style="display:none"></span>
                <span class="hint"></span>
            </div>
        </div>
    </main>

    <input type="file" id="fileInput" hidden
        accept=".txt,.md,.pdf,.py,.js,.jsx,.ts,.tsx,.html,.htm,.css,.scss,.sass,.c,.cpp,.cc,.cxx,.h,.hpp,.java,.kt,.go,.rs,.swift,.rb,.php,.pl,.sh,.bash,.zsh,.json,.xml,.yaml,.yml,.toml,.ini,.cfg,.conf,.sql,.r,.m,.lua,.dart,.scala,.groovy,.clj,.cs,.vb,.fs,.fsx,.pas,.dpr,.log,.csv,.tsv,.tex,.bib,.dockerfile,.makefile,.cmake,.gradle,.podfile">

    <script src="{{ url_for('static', filename='script.js') }}?v={{ v }}"></script>
</body>
</html>
